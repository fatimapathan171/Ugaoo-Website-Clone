    <br>
    <!-- Form -->
    <div class="row">   
        <div class="col-sm-6 loginform">
    <div class="container page">
        <div class="login">
            <h2>Create Account</h2>
        </div>
    </div>
   <form action="signup" method="post" onsubmit="return Create()">
    <div class="container page">
        <input type="text" class="form-control" id="fname" placeholder="First Name" name="fname">
    </div>
    <br>

    <div class="container page">
        <input type="text" class="form-control" id="lname" placeholder="Last Name" name="lname">
    </div>
    <br>

    <div class="container page">
        <input type="email" class="form-control" id="email" placeholder="Email" name="email">
    </div>
    <br>

    <div class="container page">
        <input type="password" class="form-control box" id="pwd" placeholder="Password" name="pwd">
    </div>
    <br>

    <div class="container page">
        <button type="submit" class="btn btn-success button">
            CREATE
        </button>
    </div>

</form>
    <div class="container page">
        <div>
           <a href="Home.html"><button type="button" class="btn btn-outline-light text-success">Return to store</button></a>
        </div>

    </div>
    </div>
    </div>

<script>
function Create() {
    let fname = document.getElementById("fname").value;
    let lname = document.getElementById("lname").value;
    let email = document.getElementById("email").value;
    let pwd = document.getElementById("pwd").value;

    if (fname === "") {
        alert("First name required");
        return false;
    }

    if (lname === "") {
        alert("Last name required");
        return false;
    }

    if (email === "") {
        alert("Email required");
        return false;
    }

    if (pwd === "") {
        alert("Password required");
        return false;
    }

    if (pwd.length < 6) {
        alert("Password must be at least 6 characters long");
        return false;
    }

    return true;
}
</script>
</body>
